<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Wavelume · Payments admin</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--acc:#7cc4ff;--bg:#0b0d12;--card:#151922;--line:rgba(255,255,255,.09);--mut:#9aa3b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8ecf2;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
.wrap{max-width:720px;margin:0 auto}h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 18px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--card);border:1px solid var(--line);color:#cfd6e0;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);color:#071018;border-color:var(--acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.email{font-weight:600;word-break:break-all}.amt{font-weight:700;color:#8fe3a8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px;margin:8px 0 10px;color:#cfd6e0}.kv span:nth-child(odd){color:var(--mut)}
code{background:rgba(255,255,255,.07);padding:2px 6px;border-radius:6px;font-size:14px;letter-spacing:.03em}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button,.big{border:0;border-radius:10px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.ok{background:#2fbf71;color:#04140a}.no{background:rgba(255,90,90,.15);color:#ff8d8d;border:1px solid rgba(255,90,90,.35)!important}
.ghost{background:none;border:1px solid var(--line)!important;color:#cfd6e0}.big{background:var(--acc);color:#071018}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08)}.tag.approved{background:rgba(47,191,113,.18);color:#8fe3a8}.tag.rejected{background:rgba(255,90,90,.15);color:#ff8d8d}
.empty,.note{color:var(--mut);text-align:center;padding:30px 10px}.err{color:#ff8d8d}
.tip{font-size:13px;color:#cfd6e0;background:rgba(124,196,255,.08);border:1px solid rgba(124,196,255,.2);border-radius:12px;padding:10px 12px;margin-bottom:14px}
form{display:grid;gap:8px;max-width:340px;margin:20px auto}input{background:#0f1218;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px 12px;font:inherit}
a{color:var(--acc)}
</style></head>
<body><div class="wrap">
  <h1>Payments admin</h1>
  <p class="sub" id="who">Loading…</p>
  <div id="main"></div>
</div>
<script src="config.js"></script>
<script type="module">
import { createBackend } from "./backend.js";
const cfg = window.APP_CONFIG || {}, $ = (id) => document.getElementById(id), main = $("main");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const when = (t) => { if (!t) return ""; const d = new Date(t); return d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const rupees = (p) => "₹" + (Number(p || 0) / 100).toLocaleString("en-IN", { maximumFractionDigits: 2 });
let be, me, tab = "pending", timer = 0, armed = null, flash = "";

function signInForm(msg) {
  $("who").textContent = "Sign in with your admin account.";
  main.innerHTML = `<form id="f"><input id="em" type="email" placeholder="Email" autocomplete="username" required><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="big">Sign in</button><div id="fm" class="err">${esc(msg || "")}</div></form>`;
  $("f").onsubmit = async (e) => { e.preventDefault(); $("fm").textContent = ""; try { await be.signIn($("em").value.trim(), $("pw").value); await boot(); } catch (er) { $("fm").textContent = er.message || "Sign-in failed"; } };
}
async function render() {
  clearTimeout(timer);
  let list = [], err = "";
  try { list = await be.adminList(tab); } catch (e) { err = e.message || String(e); }
  const counts = tab === "pending" ? list.length : null;
  main.innerHTML = `${flash ? `<div class="note err">${esc(flash)}</div>` : ""}
    <div class="tip">Before approving, open your UPI / bank app and check a payment of <b>${esc(cfg.priceLabel || "₹99")}</b> arrived with that <b>transaction ID (UTR)</b>. The note should contain the user's code. Approving unlocks their account instantly.</div>
    <div class="tabs">${["pending", "approved", "rejected"].map((t) => `<button data-t="${t}" class="${t === tab ? "on" : ""}">${t[0].toUpperCase() + t.slice(1)}${t === "pending" && counts !== null ? ` (${counts})` : ""}</button>`).join("")}
      <button data-r="1" class="ghost" style="margin-left:auto">Refresh</button></div>
    <div id="list">${err ? `<div class="note err">${esc(err)}</div>` : !list.length ? `<div class="empty">Nothing ${tab} right now.</div>` : list.map(card).join("")}</div>`;
  main.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => { tab = b.dataset.t; armed = null; render(); }));
  main.querySelector("[data-r]").onclick = render;
  main.querySelectorAll("[data-act]").forEach((b) => (b.onclick = () => decide(b)));
  document.title = (tab === "pending" && list.length ? `(${list.length}) ` : "") + "Wavelume · Payments admin";
  timer = setTimeout(render, 30000);
}
function card(r) {
  const pend = r.status === "pending", a = armed && armed.id === r.id ? armed.act : null;
  return `<div class="card"><div class="row"><span class="email">${esc(r.email)}</span><span class="amt">${rupees(r.amount)}</span></div>
    <div class="kv"><span>UTR</span><span><code>${esc(r.utr)}</code></span><span>Code</span><span><code>${esc(r.ref_code)}</code></span>
    <span>Submitted</span><span>${when(r.created_at)}</span>${r.decided_at ? `<span>Decided</span><span>${when(r.decided_at)}</span>` : ""}</div>
    ${pend ? `<div class="btns">${a ? `<button class="${a === "approve" ? "ok" : "no"}" data-act="${a}" data-id="${r.id}" data-sure="1">Yes, ${a}</button><button class="ghost" data-act="cancel" data-id="${r.id}">Cancel</button>`
      : `<button class="ok" data-act="approve" data-id="${r.id}">Approve</button><button class="no" data-act="reject" data-id="${r.id}">Reject</button>`}</div>`
      : `<span class="tag ${esc(r.status)}">${esc(r.status)}</span>`}</div>`;
}
async function decide(b) {
  const id = Number(b.dataset.id) || b.dataset.id, act = b.dataset.act;
  if (act === "cancel") { armed = null; return render(); }
  if (!b.dataset.sure) { armed = { id, act }; return render(); }
  b.disabled = true; b.textContent = "Saving…";
  flash = "";
  try { await be.adminDecide(id, act === "approve"); armed = null; } catch (e) { flash = e.message || String(e); }
  render();
}
async function boot() {
  me = await be.session();
  if (!me) return signInForm();
  $("who").innerHTML = `Signed in as ${esc(me.email)} · <a href="./">Open ${esc(cfg.name || "app")}</a>`;
  const ok = await be.isAdmin().catch(() => false);
  if (!ok) { main.innerHTML = `<div class="note">This account isn't an admin.</div>`; return; }
  render();
}
(async () => {
  try { be = await createBackend(cfg); } catch (e) { main.innerHTML = `<div class="note err">Couldn't connect: ${esc(e.message)}</div>`; return; }
  be.onChange && be.onChange(() => {});
  document.addEventListener("visibilitychange", () => { if (!document.hidden && me) render(); });
  boot();
})();
</script>
</body></html>
